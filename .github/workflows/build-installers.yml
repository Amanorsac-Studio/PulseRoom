name: Build installers

# Builds: Windows installer, macOS universal DMG, Android APK, iOS (unsigned archive).
# Trigger manually (Actions tab -> Run workflow) or by pushing a tag like v1.0.0.
# Tag pushes also publish everything to a GitHub Release (public download links).

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-Windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm install dmg-license --no-save || true
      - run: npx electron-builder --mac --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-macOS
          path: dist/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npx cap add android
      - name: Generate app icons and splash
        run: |
          mkdir -p assets && cp icon.png assets/logo.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0c0e12' --iconBackgroundColorDark '#0c0e12' \
            --splashBackgroundColor '#0c0e12' --splashBackgroundColorDark '#0c0e12' \
            || echo "asset generation skipped"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PulseRoom-1.0.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-Android
          path: PulseRoom-1.0.0-Android.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npx cap add ios
      - name: Generate app icons and splash
        run: |
          mkdir -p assets && cp icon.png assets/logo.png
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#0c0e12' --iconBackgroundColorDark '#0c0e12' \
            --splashBackgroundColor '#0c0e12' --splashBackgroundColorDark '#0c0e12' \
            || echo "asset generation skipped"
      - run: npx cap sync ios
      - name: Build (unsigned — App Store/TestFlight distribution needs an Apple Developer account)
        run: |
          set -o pipefail
          cd ios/App
          ls -la
          if [ -e App.xcworkspace ]; then C="-workspace App.xcworkspace"; else C="-project App.xcodeproj"; fi
          xcodebuild $C -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log" | tail -80
          cd build/Build/Products/Release-iphoneos
          mkdir Payload && cp -r App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/PulseRoom-1.0.0-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-iOS-unsigned
          path: PulseRoom-1.0.0-iOS-unsigned.ipa

  release:
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      # Publishes installers to the PUBLIC showcase repo (source stays private here).
      # Requires secret RELEASE_TOKEN = PAT with Contents:write on the public repo.
      - uses: softprops/action-gh-release@v2
        with:
          repository: amanorsac/PulseRoom-app
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: PulseRoom ${{ github.ref_name }}
          files: |
            out/PulseRoom.Setup.*.exe
            out/PulseRoom-*-universal.dmg
            out/PulseRoom-*-Android.apk
            out/PulseRoom-*-iOS-unsigned.ipa
          body: |
            Installers built automatically by GitHub Actions.

            - **Windows:** if SmartScreen appears, click *More info → Run anyway*.
            - **macOS:** universal (Intel + Apple Silicon). First launch: right-click → Open.
            - **Android:** allow installs from unknown sources when prompted.
            - **iOS:** the .ipa is unsigned (App Store / TestFlight requires Apple Developer signing).
