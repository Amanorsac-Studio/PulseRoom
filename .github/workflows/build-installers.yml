name: Build installers

# Builds: Windows installer, macOS universal DMG, Android APK, iOS (.ipa).
# The iOS build is signed automatically when the signing secrets are present,
# and falls back to an unsigned build when they are not.
# Trigger manually (Actions -> Run workflow) or by pushing a tag like v1.0.3.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-Windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm install dmg-license --no-save || true
      - run: npx electron-builder --mac --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-macOS
          path: dist/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npx cap add android
      - name: Generate app icons and splash
        run: |
          mkdir -p assets && cp icon.png assets/logo.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0c0e12' --iconBackgroundColorDark '#0c0e12' \
            --splashBackgroundColor '#0c0e12' --splashBackgroundColorDark '#0c0e12' \
            || echo "asset generation skipped"
      - run: npx cap sync android

      # Stamps version/versionCode and wires the upload keystore into gradle.
      # Repository and organization secrets both resolve through `secrets.*`;
      # several common names are accepted so existing secrets work unchanged.
      - name: Configure release signing
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_SIGNING_KEY_BASE64 || secrets.KEYSTORE_BASE64 || secrets.UPLOAD_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_B64 || secrets.SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_SIGNING_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ANDROID_ALIAS || secrets.ANDROID_SIGNING_KEY_ALIAS || secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: node scripts/android-configure.js

      - name: Build
        run: |
          cd android && chmod +x gradlew
          if [ "${ANDROID_SIGNED}" = "true" ]; then
            ./gradlew bundleRelease assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect and verify artifacts
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE"
          if [ "${ANDROID_SIGNED}" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "$OUT/PulseRoom-${APP_VERSION}-Android.aab"
            cp android/app/build/outputs/apk/release/app-release.apk    "$OUT/PulseRoom-${APP_VERSION}-Android.apk"
            APKSIGNER="$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)"
            echo "--- APK signature ---"
            "$APKSIGNER" verify --print-certs "$OUT/PulseRoom-${APP_VERSION}-Android.apk" | grep -Ei "Signer #1 certificate (DN|SHA-256)" || true
            echo "--- AAB signature ---"
            jarsigner -verify "$OUT/PulseRoom-${APP_VERSION}-Android.aab" | tail -2
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/PulseRoom-${APP_VERSION}-Android-debug.apk"
            echo "::warning::Debug APK only — Google Play requires a signed .aab (see ANDROID_SIGNING.md)."
          fi
          ls -la "$OUT"/PulseRoom-*Android* 2>/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-Android
          path: PulseRoom-*Android*.a*

      - name: Require a Play-ready bundle
        run: |
          if [ "${ANDROID_SIGNED}" != "true" ]; then
            echo "::error::No .aab produced. ${ANDROID_SIGN_REASON:-see the signing report above}"
            exit 1
          fi
          echo "Play-ready bundle built."

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npx cap add ios
      - name: Generate app icons and splash
        run: |
          mkdir -p assets && cp icon.png assets/logo.png
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#0c0e12' --iconBackgroundColorDark '#0c0e12' \
            --splashBackgroundColor '#0c0e12' --splashBackgroundColorDark '#0c0e12' \
            || echo "asset generation skipped"
      - run: npx cap sync ios

      # Finds the right certificate/profile/API key among the secrets by
      # inspecting them, so the secret names do not matter.
      - name: Discover iOS signing material
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: node scripts/ios-discover.js

      - name: Build iOS
        id: iosbuild
        run: |
          chmod +x scripts/ios-build.sh
          bash scripts/ios-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-iOS${{ steps.iosbuild.outputs.ios_signed == 'true' && '-signed' || '-unsigned' }}
          path: PulseRoom-*-iOS*.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore

  ios-screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npx cap add ios
      - name: Generate app icons and splash
        run: |
          mkdir -p assets && cp icon.png assets/logo.png
          npx @capacitor/assets generate --ios             --iconBackgroundColor '#0c0e12' --iconBackgroundColorDark '#0c0e12'             --splashBackgroundColor '#0c0e12' --splashBackgroundColorDark '#0c0e12'             || echo "asset generation skipped"
      - run: npx cap sync ios
      - name: Capture App Store screenshots
        run: |
          chmod +x scripts/ios-screenshots.sh
          bash scripts/ios-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AppStore-Screenshots
          path: appstore-screenshots/*.png
