name: Build installers

# Builds: Windows installer, macOS universal DMG, Android APK, iOS (.ipa).
# The iOS build is signed automatically when the signing secrets are present,
# and falls back to an unsigned build when they are not.
# Trigger manually (Actions -> Run workflow) or by pushing a tag like v1.0.3.

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Send the signed .ipa to App Store Connect (TestFlight)'
        type: boolean
        default: false
  push:
    tags: ['v*']

# Three quick pushes otherwise leave three full builds running at once.
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # The bank is the product. A build that ships a broken or stale one is
      # worse than no build, so it fails here rather than at a buyer's machine.
      - name: Validate the answer bank
        shell: bash
        run: |
          node v2/validate.js --index v2/data/question-index.json             v2/data/batch-*.json v2/data/questions.seed.json
          node scripts/build-answers.js
          git diff --exit-code answers.js || { echo "answers.js is stale - run scripts/build-answers.js and commit"; exit 1; }

      - name: Build signed installer
        shell: bash
        env:
          # SEC-9: Windows installers are code-signed. When the secret is
          # absent the build still runs, unsigned, and says so loudly.
          CSC_LINK: ${{ secrets.WIN_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning title=Unsigned::WIN_CERT_P12 is not set - this installer is UNSIGNED and will trigger SmartScreen"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --win --publish never

      - name: Report what was produced
        shell: bash
        run: |
          ls -la dist/*.exe
          for f in dist/*.exe; do
            echo "sha256  $(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
            echo "bytes   $(stat -c%s "$f")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-Windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    # macOS runners bill ~10x. Signing Standard section 6: gate to tags and
    # manual dispatch so a routine push cannot burn the allowance.
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    env:
      # `secrets` cannot be read from a step-level `if`, so the presence check
      # goes through env instead.
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm install dmg-license --no-save || true

      - name: Import Developer ID certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          echo "$MAC_CERT_P12" | tr -d '[:space:]' | base64 --decode > app.p12
          # the secrets form carries a trailing newline into the password
          trim () { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          security import app.p12 -k "$KEYCHAIN" -P "$(trim "$MAC_CERT_PASSWORD")"             -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f app.p12
          # without this codesign blocks on a GUI prompt and the job hangs
          security set-key-partition-list -S apple-tool:,apple:,codesign:             -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v

      - name: Build, sign and notarize
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::warning title=Not notarized::ASC_KEY_P8 is not set - building UNSIGNED, Gatekeeper will block it"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish never
          else
            echo "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > asc.p8 2>/dev/null               || printf '%s' "$ASC_KEY_P8" > asc.p8
            export APPLE_API_KEY="$PWD/asc.p8"
            npx electron-builder --mac --publish never
            rm -f asc.p8
          fi

      # electron-builder notarizes the .app and then wraps it in a DMG, so the
      # DMG itself carries no ticket. The customer downloads the DMG, so that
      # is the thing Gatekeeper judges first: the last build produced two DMGs
      # that spctl rejected and stapler called unticketed, and the job stayed
      # green because both checks ended in `|| echo ::warning`.
      - name: Notarize and staple the disk images
        if: env.HAS_MAC_CERT == 'true' && env.HAS_ASC_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eo pipefail
          KEY="$RUNNER_TEMP/asc.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          for d in dist/*.dmg; do
            echo "== notarizing $(basename "$d")"
            xcrun notarytool submit "$d" --wait --timeout 30m               --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            xcrun stapler staple "$d"
          done
          rm -f "$KEY"

      # Fatal now. An installer a customer's Mac refuses is not a release,
      # and a warning in a green run is one nobody reads.
      - name: Verify the verdict a customer's Mac reaches
        if: env.HAS_MAC_CERT == 'true'
        run: |
          set -eo pipefail
          fail=0
          for d in dist/*.dmg; do
            echo "== $d"
            spctl --assess -vv --type install "$d" || { echo "::error::spctl refused $d"; fail=1; }
            xcrun stapler validate "$d"            || { echo "::error::not stapled: $d"; fail=1; }
          done
          if [ "$fail" = 1 ]; then
            echo "::error::At least one DMG would be blocked on a customer's Mac."
            exit 1
          fi
          echo "Both disk images are signed, notarized and stapled."

      - name: Report what was produced
        run: |
          ls -la dist/*.dmg
          for f in dist/*.dmg; do
            echo "sha256  $(shasum -a 256 "$f" | cut -d' ' -f1)  $(basename "$f")"
            echo "bytes   $(stat -f%z "$f")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-macOS
          path: dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npx cap add android
      - name: Generate app icons and splash
        run: |
          mkdir -p assets && cp icon.png assets/logo.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0c0e12' --iconBackgroundColorDark '#0c0e12' \
            --splashBackgroundColor '#0c0e12' --splashBackgroundColorDark '#0c0e12' \
            || echo "asset generation skipped"
      - run: npx cap sync android

      # Stamps version/versionCode and wires the upload keystore into gradle.
      # Repository and organization secrets both resolve through `secrets.*`;
      # several common names are accepted so existing secrets work unchanged.
      - name: Configure release signing
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_SIGNING_KEY_BASE64 || secrets.KEYSTORE_BASE64 || secrets.UPLOAD_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_B64 || secrets.SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_SIGNING_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ANDROID_ALIAS || secrets.ANDROID_SIGNING_KEY_ALIAS || secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: node scripts/android-configure.js

      - name: Build
        run: |
          cd android && chmod +x gradlew
          if [ "${ANDROID_SIGNED}" = "true" ]; then
            ./gradlew bundleRelease assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # Verifies the ARTIFACT, not the flag. The previous version piped
      # apksigner through `grep ... || true` and only tailed jarsigner, so a
      # bundle jarsigner called unsigned still left the job green. It did:
      # the build had been signed with the Apple certificate.
      - name: Collect and verify artifacts
        run: |
          set -eo pipefail
          OUT="$GITHUB_WORKSPACE"
          if [ "${ANDROID_SIGNED}" != "true" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/PulseRoom-${APP_VERSION}-Android-debug.apk"
            echo "::warning::Debug APK only — Google Play requires a signed .aab (see ANDROID_SIGNING.md)."
            ls -la "$OUT"/PulseRoom-*Android* || true
            exit 0
          fi

          cp android/app/build/outputs/bundle/release/app-release.aab "$OUT/PulseRoom-${APP_VERSION}-Android.aab"
          cp android/app/build/outputs/apk/release/app-release.apk    "$OUT/PulseRoom-${APP_VERSION}-Android.apk"
          APKSIGNER="$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)"

          echo "--- APK signature ---"
          # No `|| true`: an APK whose signature does not verify is a failure.
          "$APKSIGNER" verify --verbose --print-certs "$OUT/PulseRoom-${APP_VERSION}-Android.apk"

          echo "--- AAB signature ---"
          # jarsigner exits 0 while printing "treated as unsigned", so the
          # text is what decides, not the exit code.
          jarsigner -verify -strict "$OUT/PulseRoom-${APP_VERSION}-Android.aab" > aab-verify.txt 2>&1 || true
          tail -5 aab-verify.txt
          if grep -qi "treated as unsigned\|not parsable or not verifiable" aab-verify.txt; then
            echo "::error::The .aab is not verifiably signed. Google Play will reject it. See the signing report above for which secret supplied the key."
            exit 1
          fi
          grep -qi "jar verified" aab-verify.txt || {
            echo "::error::jarsigner did not report the .aab as verified."; exit 1; }

          ls -la "$OUT"/PulseRoom-*Android*

      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-Android
          path: PulseRoom-*Android*.a*

      - name: Require a Play-ready bundle
        run: |
          if [ "${ANDROID_SIGNED}" != "true" ]; then
            echo "::error::No .aab produced. ${ANDROID_SIGN_REASON:-see the signing report above}"
            exit 1
          fi
          echo "Play-ready bundle built."

  ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npx cap add ios
      - name: Generate app icons and splash
        run: |
          mkdir -p assets && cp icon.png assets/logo.png
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#0c0e12' --iconBackgroundColorDark '#0c0e12' \
            --splashBackgroundColor '#0c0e12' --splashBackgroundColorDark '#0c0e12' \
            || echo "asset generation skipped"
      - run: npx cap sync ios

      # Finds the right certificate/profile/API key among the secrets by
      # inspecting them, so the secret names do not matter.
      - name: Discover iOS signing material
        if: always()
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -o pipefail
          node scripts/ios-discover.js 2>&1 | tee "$GITHUB_WORKSPACE/ios-discover.log"

      - name: Build iOS
        id: iosbuild
        env:
          # Must match the version record in App Store Connect, otherwise the
          # uploaded build cannot be selected for that version.
          IOS_MARKETING_VERSION: '1.0'
          # Default false, including on a tag push: a tag means build it, not
          # ship it. Building a signed .ipa and sending it to Apple are
          # separate decisions.
          UPLOAD_TO_TESTFLIGHT: ${{ github.event.inputs.upload_to_testflight || 'false' }}
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x scripts/ios-build.sh
          bash scripts/ios-build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ios-step.log"

      - uses: actions/upload-artifact@v4
        with:
          name: PulseRoom-iOS${{ steps.iosbuild.outputs.ios_signed == 'true' && '-signed' || '-unsigned' }}
          path: PulseRoom-*-iOS*.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore

      # The repository is private, so logs are not readable through the API.
      # Publishing them to a branch makes them fetchable with plain git.
      - name: Publish diagnostics
        if: always()
        run: |
          set +e
          REP=/tmp/ci-report
          rm -rf "$REP" && mkdir -p "$REP"
          for f in ios-discover.log ios-step.log; do
            [ -f "$GITHUB_WORKSPACE/$f" ] && cp "$GITHUB_WORKSPACE/$f" "$REP/$f"
          done
          [ -f "$GITHUB_WORKSPACE/ios-build.log" ] && tail -300 "$GITHUB_WORKSPACE/ios-build.log" > "$REP/xcodebuild-tail.log"
          {
            echo "run: ${{ github.run_number }}"
            echo "sha: ${{ github.sha }}"
            echo "ref: ${{ github.ref_name }}"
            echo "signed: ${{ steps.iosbuild.outputs.ios_signed }}"
            echo "finished: $(date -u)"
          } > "$REP/status.txt"
          cd /tmp && rm -rf logsrepo && mkdir logsrepo && cd logsrepo
          git init -q
          git config user.email "actions@github.com"
          git config user.name "PulseRoom CI"
          mkdir -p ios && cp "$REP"/* ios/ 2>/dev/null
          git add -A
          git commit -q -m "iOS diagnostics for run ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-logs
          echo "diagnostics pushed to the ci-logs branch"

      - name: Require a signed iOS build
        run: |
          if [ "${{ steps.iosbuild.outputs.ios_signed }}" != "true" ]; then
            echo "::error::iOS build was NOT signed. See the 'iOS signing' summary above for the reason."
            exit 1
          fi
          echo "Signed."

  ios-screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:www
      - run: npx cap add ios
      - name: Generate app icons and splash
        run: |
          mkdir -p assets && cp icon.png assets/logo.png
          npx @capacitor/assets generate --ios             --iconBackgroundColor '#0c0e12' --iconBackgroundColorDark '#0c0e12'             --splashBackgroundColor '#0c0e12' --splashBackgroundColorDark '#0c0e12'             || echo "asset generation skipped"
      - run: npx cap sync ios
      - name: Capture App Store screenshots
        run: |
          chmod +x scripts/ios-screenshots.sh
          bash scripts/ios-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AppStore-Screenshots
          path: appstore-screenshots/*.png
