name: Generate upload keystore

# Run this ONCE, only if you do not already have an Android upload key.
# It creates a keystore and hands it back as a downloadable artifact together
# with the password and the base64 text to paste into a repository secret.
#
# Nothing secret is printed to the log — everything is inside the artifact.
#
# IMPORTANT: if PulseRoom has already been published to Google Play, do NOT use
# this. Play only accepts updates signed with the ORIGINAL upload key.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create keystore
        run: |
          set -e
          mkdir -p out
          PW="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 28)"

          keytool -genkeypair -v \
            -keystore out/pulseroom-upload.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=PulseRoom, O=Amanorsac Studio, C=GH" \
            > /dev/null

          base64 -w0 out/pulseroom-upload.jks > out/keystore-base64.txt

          cat > out/READ-ME-FIRST.txt <<EOF
          PulseRoom — Android upload key
          ==============================

          THREE FILES ARE IN THIS ZIP

            pulseroom-upload.jks   the key itself
            keystore-base64.txt    the same key as text, for the GitHub secret
            READ-ME-FIRST.txt      this file

          YOUR KEYSTORE PASSWORD (also the key password):

            $PW

          WHAT TO DO NOW

            1. Save pulseroom-upload.jks and this password somewhere safe and
               permanent (password manager, backup drive). Every future update
               of PulseRoom on Google Play must be signed with this key. If it
               is lost, you cannot update the app.

            2. In GitHub: repository Settings -> Secrets and variables ->
               Actions -> New repository secret. Create two secrets:

                 Name:  ANDROID_KEYSTORE_BASE64
                 Value: the whole contents of keystore-base64.txt

                 Name:  ANDROID_KEYSTORE_PASSWORD
                 Value: the password above

            3. Delete this artifact from the Actions run once both secrets are
               saved, so the key is not sitting in build storage.

            4. Re-run the "Build installers" workflow. It will produce
               PulseRoom-<version>-Android.aab, ready for the Play Console.

          The key alias is: upload
          EOF

          echo "Keystore created. Everything you need is in the artifact."
          keytool -list -keystore out/pulseroom-upload.jks -storepass "$PW" | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: UPLOAD-KEYSTORE-download-then-delete
          path: out/
          retention-days: 1
